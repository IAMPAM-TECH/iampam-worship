<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <title>예배 프레젠테이션</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Malgun Gothic", sans-serif;
        background: #000;
        overflow: hidden;
        height: 100vh;
      }

      .presentation-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .slide {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0;
        left: 0;
        opacity: 0;
        transition: opacity 0.27s ease-in-out;
        z-index: 1;
      }

      .slide.active {
        opacity: 1;
        z-index: 2;
      }

      .slide.fade-out {
        opacity: 0;
        transition: opacity 0.27s ease-in-out;
        z-index: 0;
      }

      .slide img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .bible-content {
        color: white;
        text-align: center;
        padding: 40px 30px;
        width: 95%;
        height: 95%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 18px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }

      .bible-title {
        font-size: clamp(1.4em, 2.8vw, 2.1em);
        font-weight: bold;
        margin-bottom: 20px;
        color: #ffd700;
        text-shadow: 2px 2px 8px #222;
        flex-shrink: 0;
      }

      .bible-verses-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        overflow: hidden;
      }

      .bible-verse {
        font-size: clamp(1.95em, 3.9vw, 2.86em);
        line-height: 1.6;
        margin-bottom: 15px;
        text-align: left;
        letter-spacing: 0.02em;
        word-break: keep-all;
        text-shadow: 1px 1px 8px #222;
        max-width: 100%;
        display: flex;
        align-items: flex-start;
        width: 100%; /* 줄바꿈 시 항상 왼쪽 정렬 */
      }

      .verse-number {
        color: #ffd700;
        font-weight: bold;
        margin-right: 27px; /* 50% 증가: 18px → 27px */
        font-size: 1.1em;
        text-shadow: 1px 1px 6px #222;
        flex-shrink: 0;
        min-width: fit-content;
        align-self: center;
      }

      .bible-text-line {
        color: #fff;
        text-shadow: 1px 1px 8px #222, 0 0 2px #ffd700;
        font-weight: 500;
        display: block;
        text-align: left;
        word-break: keep-all;
        width: 100%;
        line-height: 1.6;
        margin-bottom: 5px;
      }

      /* 강조 구절 스타일 */
      .bible-text-line.strong {
        font-weight: 700;
        background-color: #ffff00;
        color: #000;
        padding: 2px 4px;
        border-radius: 3px;
        text-shadow: none;
        display: inline-block;
        margin: 1px 0;
        font-size: 1.3em;
      }

      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 18px;
      }

      .error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff6b6b;
        font-size: 18px;
        text-align: center;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
      }

      .fade-in {
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .fullscreen-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        z-index: 100;
        transition: opacity 0.3s;
      }

      .fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.9);
      }

      .slide-info {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 100;
        transition: opacity 0.3s;
      }

      .slide-counter {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 100;
        transition: opacity 0.3s;
      }

      .controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 100;
        transition: opacity 0.3s;
      }

      .control-btn {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s;
      }

      .control-btn:hover {
        background: rgba(0, 0, 0, 0.9);
      }

      /* 전체화면 모드에서 UI 숨기기 */
      .fullscreen .slide-info,
      .fullscreen .slide-counter,
      .fullscreen .controls,
      .fullscreen .fullscreen-btn {
        opacity: 0;
        pointer-events: none;
      }

      /* 전체화면 모드에서 이미지 전체화면 */
      .fullscreen .slide img {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        border-radius: 0;
      }

      /* 슬라이드 전환 애니메이션 개선 */
      .slide {
        will-change: transform, opacity;
      }

      /* 첫 번째 슬라이드 로드 시 애니메이션 */
      .slide:first-child.active {
        animation: initialFadeIn 1s ease-out;
      }

      @keyframes initialFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .slide-image-16by9 {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slide-image-cover {
        width: 100%;
        height: 100%;
        object-fit: contain; /* cover → contain */
        object-position: center;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="login-section"
      style="
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #222;
        z-index: 1000;
        position: fixed;
        top: 0;
        left: 0;
      "
    >
      <div
        style="
          background: #fff;
          padding: 36px 32px 32px 32px;
          border-radius: 18px;
          box-shadow: 0 4px 24px rgba(80, 80, 120, 0.1);
          min-width: 320px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        "
      >
        <select
          id="worshipFolderSelect"
          style="
            width: 220px;
            padding: 12px 10px;
            border-radius: 8px;
            border: 1.2px solid #e5e7ef;
            font-size: 1em;
            margin-bottom: 10px;
          "
        ></select>
        <input
          type="text"
          id="username"
          value="admin"
          readonly
          style="
            width: 220px;
            padding: 12px 10px;
            border-radius: 8px;
            border: 1.2px solid #e5e7ef;
            font-size: 1em;
            margin-bottom: 10px;
          "
        />
        <input
          type="password"
          id="password"
          placeholder="비밀번호"
          style="
            width: 220px;
            padding: 12px 10px;
            border-radius: 8px;
            border: 1.2px solid #e5e7ef;
            font-size: 1em;
            margin-bottom: 10px;
          "
        />
        <button
          onclick="login()"
          style="
            width: 220px;
            padding: 13px 0;
            border-radius: 8px;
            border: none;
            background: #7b8cff;
            color: #fff;
            font-size: 1.08em;
            font-weight: 500;
            cursor: pointer;
          "
        >
          로그인
        </button>
        <div
          id="loginError"
          style="color: #e74c3c; margin-top: 8px; font-size: 1em; display: none"
        ></div>
      </div>
    </div>
    <div class="presentation-container" style="display: none">
      <div class="loading">예배 데이터를 불러오는 중...</div>
      <div class="slide-info"></div>
      <div class="slide-counter"></div>
      <button class="fullscreen-btn" onclick="toggleFullscreen()">
        전체화면
      </button>
      <div class="controls">
        <button class="control-btn" onclick="previousFile()">이전 파일</button>
        <button class="control-btn" onclick="previousSlide()">이전</button>
        <button class="control-btn" onclick="toggleAutoPlay()" id="autoPlayBtn">
          자동재생
        </button>
        <button class="control-btn" onclick="nextSlide()">다음</button>
        <button class="control-btn" onclick="nextFile()">다음 파일</button>
      </div>
    </div>

    <script>
      // API 베이스 URL
      const API_BASE =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? "http://localhost:3000/api"
          : "https://yl8j0hj690.execute-api.ap-northeast-2.amazonaws.com/api";

      // 페이지 로드 시 찬양반주 파일 목록 미리 로드 (성능 최적화)
      // DOMContentLoaded 이벤트가 이미 발생했을 수 있으므로 즉시 실행
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', preloadAccompanimentFiles);
      } else {
        // 이미 로드되었으면 즉시 실행
        preloadAccompanimentFiles();
      }

      let worshipData = null;
      let currentSlideIndex = 0;
      let currentImageIndex = 0;
      let slides = [];
      let autoPlayInterval = null;
      let isAutoPlaying = false;
      let selectedWorshipFolder = "";
      let isLoggedIn = false;
      let currentAccompanimentAudio = null; // 현재 재생 중인 반주 Audio 객체
      let currentAccompanimentContent = null; // 현재 재생 중인 반주의 content (같은 폴더 확인용)

      async function loadWorshipFolders() {
        try {
          const res = await fetch(`${API_BASE}/churches`);
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          const data = await res.json();
          const select = document.getElementById("worshipFolderSelect");
          select.innerHTML = '<option value="">교회 선택</option>';

          if (data && data.length > 0) {
            data.forEach((church) => {
              const opt = document.createElement("option");
              opt.value = church.folder;
              opt.textContent = church.name;
              select.appendChild(opt);
            });
          } else {
            // 기본 교회 목록 제공
            const defaultChurches = ["hishalom", "test", "demo"];
            defaultChurches.forEach((church) => {
              const opt = document.createElement("option");
              opt.value = church;
              opt.textContent = church;
              select.appendChild(opt);
            });
            console.log(
              "DynamoDB에서 교회 목록을 찾을 수 없어 기본 목록을 제공합니다."
            );
          }

          select.addEventListener("change", (e) => {
            selectedWorshipFolder = e.target.value;
          });
        } catch (error) {
          console.error("교회 목록 로드 오류:", error);
          const select = document.getElementById("worshipFolderSelect");
          select.innerHTML = '<option value="">교회 선택</option>';

          // 에러 시에도 기본 교회 목록 제공
          const defaultChurches = ["hishalom", "test", "demo"];
          defaultChurches.forEach((church) => {
            const opt = document.createElement("option");
            opt.value = church;
            opt.textContent = church;
            select.appendChild(opt);
          });
        }
      }

      async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const loginError = document.getElementById("loginError");
        loginError.style.display = "none";
        if (!selectedWorshipFolder) {
          loginError.textContent = "교회(폴더)를 선택하세요.";
          loginError.style.display = "block";
          return;
        }
        const response = await fetch(`${API_BASE}/admin-login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: username,
            password,
            folder: selectedWorshipFolder,
          }),
        });
        const data = await response.json();
        if (data.success) {
          isLoggedIn = true;
          document.getElementById("login-section").style.display = "none";
          document.querySelector(".presentation-container").style.display = "";
          loadWorshipData(selectedWorshipFolder);
        } else {
          loginError.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
          loginError.style.display = "block";
        }
      }

      // 예배 데이터 처리
      async function processWorshipData() {
        const loadingElement = document.querySelector(".loading");
        loadingElement.style.display = "none";

        // 슬라이드 및 상태 초기화 (이전 로딩 잔여물 제거)
        slides = [];
        currentSlideIndex = 0;
        const container = document.querySelector(".presentation-container");
        container.querySelectorAll(".slide").forEach((s) => s.remove());

        for (let i = 0; i < worshipData.Worship.length; i++) {
          const step = worshipData.Worship[i];
          const slideImages = await getSlideImages(step);

          // 빈 이미지 배열인 경우 해당 스텝을 건너뛰기
          if (slideImages.length === 0) {
            console.log(
              `Step ${i + 1}: ${step.Type} - 빈 Content로 인해 건너뜀`
            );
            continue;
          }

          for (let j = 0; j < slideImages.length; j++) {
            slides.push({
              step: step,
              imagePath: slideImages[j],
              stepIndex: i,
              imageIndex: j,
            });
          }
        }

        if (slides.length > 0) {
          showSlide(0);
          updateSlideCounter();
        } else {
          showError("표시할 슬라이드가 없습니다.");
        }
      }

      // 슬라이드 이미지 경로 생성
      async function getSlideImages(step) {
        const type = step.Type;
        const content = step.Content;

        // 성경인 경우 - API 실패 시에도 슬라이드를 유지하기 위해 fallback
        if (type === "성경") {
          // Content가 없거나 객체가 아니면 슬라이드 1개 반환 (showSlide에서 안내 메시지 표시)
          if (!content || typeof content !== "object") {
            return [content || {}];
          }
          const singleChapterBooks = [
            "요한이서",
            "요한삼서",
            "유다서",
            "오바댜",
            "빌레몬서",
          ];
          const isSingleChapter = singleChapterBooks.includes(content.book);
          const effectiveChapter = isSingleChapter ? 1 : content.chapter;
          if (isSingleChapter && content.chapter !== 1) {
            content.chapter = 1; // 표시 일관성을 위해 보정
          }

          try {
            const response = await fetch(
              `${API_BASE}/bible?book=${encodeURIComponent(
                content.book
              )}&chapter=${effectiveChapter}&startVerse=${
                content.startVerse
              }&endVerse=${content.endVerse}`
            );
            if (response.ok) {
              const verses = await response.json();
              return [verses]; // 성경 구절 데이터를 반환
            } else {
              console.warn(
                "성경 구절을 가져올 수 없습니다. fallback으로 진행합니다."
              );
              return [content]; // 슬라이드 스킵 방지용 fallback
            }
          } catch (error) {
            console.error("성경 구절 조회 오류:", error);
            return [content]; // 슬라이드 스킵 방지용 fallback
          }
        }

        // Content가 비어있거나 null인 경우 빈 배열 반환 (찬양, 찬송, 교독 유형은 제외)
        let cleanContent = content;
        if (
          !content ||
          (typeof content === "string" && content.trim() === "")
        ) {
          // 찬양, 찬송, 교독 유형의 경우 content가 비어있어도 S3 폴더를 확인
          if (type === "찬양" || type === "찬송" || type === "교독") {
            console.log(
              `Step ${step.Step}: ${type} - Content가 비어있지만 S3 폴더를 확인합니다.`
            );
            // content가 비어있으면 빈 문자열로 처리 (찬양, 찬송 모두 동일하게)
            cleanContent = "";
          } else {
            console.log(
              `Step ${step.Step}: ${type} - 빈 Content로 인해 건너뜀`
            );
            return [];
          }
        } else {
          // 찬양, 찬송, 교독 유형의 경우 Content에서 접두사 제거하고 끝의 "/" 제거
          if (type === "찬양" || type === "찬송" || type === "교독") {
            if (typeof content === "string") {
              cleanContent = content.trim(); // 앞뒤 공백 제거
              // "찬양" 또는 "찬송" 접두사가 있으면 제거
              if (type === "찬양" && cleanContent.startsWith("찬양")) {
                cleanContent = cleanContent.substring(3).trim();
              } else if (type === "찬송" && cleanContent.startsWith("찬송")) {
                cleanContent = cleanContent.substring(3).trim();
              }
              // 끝의 "/" 제거 (찬양, 찬송, 교독 모두 적용)
              if (cleanContent.endsWith("/")) {
                cleanContent = cleanContent.slice(0, -1).trim();
              }
            }
          }
        }

        // 간지 유형 - S3에서 단일 이미지 불러오기
        if (type === "간지") {
          return [
            `${API_BASE}/s3-image?path=${encodeURIComponent(
              "간지/" + cleanContent + ".png"
            )}`,
          ];
        }

        // 자료 유형 - S3에서 단일 이미지 불러오기
        if (type === "자료") {
          return [
            `${API_BASE}/s3-image?path=${encodeURIComponent(
              "자료/" + cleanContent + ".png"
            )}`,
          ];
        }

        // 찬양, 찬송, 교독 유형 - S3에서 폴더 내 여러 이미지 불러오기
        const images = [];
        try {
          // URL 인코딩을 두 번 적용하여 한글 폴더명 문제 해결
          const encodedContent = encodeURIComponent(cleanContent);
          console.log(
            `S3 폴더 조회 시도: ${type}/${cleanContent} (encoded: ${encodedContent})`
          );

          const response = await fetch(
            `${API_BASE}/s3-folder/${type}/${encodedContent}`
          );
          if (response.ok) {
            const files = await response.json();
            console.log(
              `S3 폴더 조회 성공: ${type}/${cleanContent}, 파일 수: ${files.length}`
            );
            console.log(`- 파일 목록:`, files);

            // 다양한 파일명 패턴 지원
            let pageFiles = [];

            // 1. page_001.png, page_002.png 등의 파일들을 순서대로 찾기
            pageFiles = files
              .filter((file) => file.match(/^page_\d{3}\.png$/))
              .sort((a, b) => {
                // 숫자 부분을 추출하여 숫자로 정렬
                const numA = parseInt(a.match(/page_(\d+)\.png/)[1]);
                const numB = parseInt(b.match(/page_(\d+)\.png/)[1]);
                return numA - numB;
              });

            // 2. page_001.jpg, page_002.jpg 등의 파일들도 찾기
            if (pageFiles.length === 0) {
              pageFiles = files
                .filter((file) => file.match(/^page_\d{3}\.jpg$/))
                .sort((a, b) => {
                  const numA = parseInt(a.match(/page_(\d+)\.jpg/)[1]);
                  const numB = parseInt(b.match(/page_(\d+)\.jpg/)[1]);
                  return numA - numB;
                });
            }

            // 3. 001.png, 002.png 등의 파일들도 찾기
            if (pageFiles.length === 0) {
              pageFiles = files
                .filter((file) => file.match(/^\d{3}\.png$/))
                .sort((a, b) => {
                  const numA = parseInt(a.match(/^(\d+)\.png/)[1]);
                  const numB = parseInt(b.match(/^(\d+)\.png/)[1]);
                  return numA - numB;
                });
            }

            // 4. 001.jpg, 002.jpg 등의 파일들도 찾기
            if (pageFiles.length === 0) {
              pageFiles = files
                .filter((file) => file.match(/^\d{3}\.jpg$/))
                .sort((a, b) => {
                  const numA = parseInt(a.match(/^(\d+)\.jpg/)[1]);
                  const numB = parseInt(b.match(/^(\d+)\.jpg/)[1]);
                  return numA - numB;
                });
            }

            console.log(`정렬된 페이지 파일들:`, pageFiles);

            // 정렬된 파일들을 이미지 경로로 변환
            pageFiles.forEach((file) => {
              // cleanContent가 빈 문자열이면 type/file, 그렇지 않으면 type/content/file 형태로 구성
              const imagePath = cleanContent
                ? `${type}/${cleanContent}/${file}`
                : `${type}/${file}`;
              images.push(
                `${API_BASE}/s3-image?path=${encodeURIComponent(imagePath)}`
              );
            });

            // 만약 page_xxx.png 파일이 없고 다른 이미지 파일이 있는 경우
            if (images.length === 0 && files.length > 0) {
              console.log(
                `page_xxx.png 파일이 없어서 다른 이미지 파일들을 사용합니다.`
              );
              files.forEach((file) => {
                if (/\.(png|jpg|jpeg|gif|bmp|webp)$/i.test(file)) {
                  // cleanContent가 빈 문자열이면 type/file, 그렇지 않으면 type/content/file 형태로 구성
                  const imagePath = cleanContent
                    ? `${type}/${cleanContent}/${file}`
                    : `${type}/${file}`;
                  images.push(
                    `${API_BASE}/s3-image?path=${encodeURIComponent(imagePath)}`
                  );
                }
              });
            }

            // 여전히 이미지가 없으면 Content가 비어있다고 처리
            if (images.length === 0) {
              console.log(
                `Step ${step.Step}: ${type} - 폴더에 이미지 파일이 없어서 건너뜀 (${type}/${cleanContent})`
              );
              return [];
            }
          } else {
            console.error(
              `S3 폴더 조회 실패: ${response.status} - ${type}/${cleanContent}`
            );
            // S3 폴더 조회 실패 시에도 빈 배열 반환
            return [];
          }
        } catch (error) {
          console.error("S3 폴더 목록 조회 오류:", error);
          return [];
        }

        return images;
      }

      // 성경 구절 가져오기
      async function getBibleVerses(bibleInfo) {
        try {
          const response = await fetch(
            `${API_BASE}/bible?book=${encodeURIComponent(
              bibleInfo.book
            )}&chapter=${bibleInfo.chapter}&startVerse=${
              bibleInfo.startVerse
            }&endVerse=${bibleInfo.endVerse}`
          );
          if (!response.ok) {
            throw new Error("성경 구절을 가져올 수 없습니다.");
          }
          return await response.json();
        } catch (error) {
          console.error("성경 구절 조회 오류:", error);
          return null;
        }
      }

      // 슬라이드 정리 함수
      function cleanupSlides() {
        const container = document.querySelector(".presentation-container");
        const slides = container.querySelectorAll(".slide");
        slides.forEach((slide) => {
          if (!slide.classList.contains("active")) {
            slide.remove();
          }
        });
      }

      // 찬양반주 폴더의 파일 목록 캐시
      let accompanimentFileCache = null;
      let accompanimentFileCacheTime = 0;
      const CACHE_DURATION = 30 * 60 * 1000; // 30분 (localStorage와 동일하게)
      const STORAGE_KEY = 'hishalom_accompaniment_files';
      const STORAGE_TIMESTAMP_KEY = 'hishalom_accompaniment_files_timestamp';
      let isLoadingFiles = false; // 중복 로드 방지

      /**
       * localStorage에서 파일 목록 캐시 가져오기
       */
      function getCachedFilesFromStorage() {
        try {
          const cachedData = localStorage.getItem(STORAGE_KEY);
          const cachedTime = localStorage.getItem(STORAGE_TIMESTAMP_KEY);
          
          if (cachedData && cachedTime) {
            const timestamp = parseInt(cachedTime, 10);
            const now = Date.now();
            
            // 캐시가 30분 이내라면 사용
            if (now - timestamp < CACHE_DURATION) {
              const files = JSON.parse(cachedData);
              console.log('localStorage에서 찬양반주 파일 목록 로드:', files.length, '개');
              return files;
            } else {
              // 만료된 캐시 삭제
              localStorage.removeItem(STORAGE_KEY);
              localStorage.removeItem(STORAGE_TIMESTAMP_KEY);
            }
          }
        } catch (error) {
          console.warn('localStorage 캐시 읽기 오류:', error);
        }
        return null;
      }

      /**
       * localStorage에 파일 목록 캐시 저장
       */
      function saveCachedFilesToStorage(files) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
          localStorage.setItem(STORAGE_TIMESTAMP_KEY, Date.now().toString());
          console.log('localStorage에 찬양반주 파일 목록 저장:', files.length, '개');
        } catch (error) {
          console.warn('localStorage 캐시 저장 오류:', error);
        }
      }

      /**
       * S3에서 찬양반주 폴더의 파일 목록 가져오기
       * localStorage 캐시를 우선 사용하고, 없거나 만료되었으면 API 호출
       */
      async function loadAccompanimentFiles() {
        const now = Date.now();
        
        // 1. 메모리 캐시 확인 (가장 빠름)
        if (accompanimentFileCache && (now - accompanimentFileCacheTime) < CACHE_DURATION) {
          return accompanimentFileCache;
        }

        // 2. localStorage 캐시 확인
        const cachedFiles = getCachedFilesFromStorage();
        if (cachedFiles) {
          accompanimentFileCache = cachedFiles;
          accompanimentFileCacheTime = now;
          return cachedFiles;
        }

        // 3. 이미 로딩 중이면 기다림 (중복 요청 방지)
        if (isLoadingFiles) {
          // 최대 5초 대기
          for (let i = 0; i < 50; i++) {
            await new Promise(resolve => setTimeout(resolve, 100));
            if (accompanimentFileCache) {
              return accompanimentFileCache;
            }
          }
        }

        // 4. API 호출
        isLoadingFiles = true;
        try {
          const response = await fetch(`${API_BASE}/s3-explorer?path=찬양반주/`);
          if (!response.ok) {
            console.warn('찬양반주 폴더 목록을 가져올 수 없습니다:', response.status);
            return [];
          }
          const data = await response.json();
          const files = (data.files || [])
            .filter(file => file.name.endsWith('.mp3'))
            .map(file => file.name);
          
          // 메모리 캐시 저장
          accompanimentFileCache = files;
          accompanimentFileCacheTime = now;
          
          // localStorage 캐시 저장
          saveCachedFilesToStorage(files);
          
          console.log('찬양반주 파일 목록 로드 완료:', files.length, '개');
          return files;
        } catch (error) {
          console.error('찬양반주 파일 목록 로드 오류:', error);
          return [];
        } finally {
          isLoadingFiles = false;
        }
      }

      /**
       * 페이지 로드 시 찬양반주 파일 목록 미리 로드 (비동기, 백그라운드)
       * 사용자가 찬송을 볼 때까지 기다리지 않고 미리 로드
       */
      function preloadAccompanimentFiles() {
        // 즉시 실행하지 않고 약간의 지연 후 실행 (페이지 로드 우선)
        setTimeout(() => {
          loadAccompanimentFiles().catch(error => {
            console.warn('찬양반주 파일 목록 사전 로드 실패:', error);
          });
        }, 1000); // 1초 후 백그라운드에서 로드
      }

      /**
       * 문자열에서 공백 제거 (비교용)
       */
      function removeSpaces(str) {
        return str.replace(/\s+/g, '');
      }

      /**
       * 문자열 유사도 계산 (간단한 방법)
       * 공백을 제거하고 비교하여 유사도 반환
       */
      function calculateSimilarity(str1, str2) {
        const s1 = removeSpaces(str1.toLowerCase());
        const s2 = removeSpaces(str2.toLowerCase());
        
        if (s1 === s2) return 100;
        if (s1.includes(s2) || s2.includes(s1)) return 80;
        
        // 공통 문자 개수 기반 유사도
        let common = 0;
        const minLen = Math.min(s1.length, s2.length);
        for (let i = 0; i < minLen; i++) {
          if (s1[i] === s2[i]) common++;
        }
        return (common / Math.max(s1.length, s2.length)) * 100;
      }

      /**
       * 찬송 내용에서 MP3 파일 경로 찾기 (S3 파일 목록과 매칭)
       * @param {string} content - 찬송 내용 (예: "069장 온천하만물우러러(통33)/")
       * @returns {Promise<string|null>} - MP3 파일 경로 또는 null
       */
      async function getAccompanimentFilePath(content) {
        if (!content || typeof content !== 'string') {
          return null;
        }

        // 1. 번호 추출 (예: "069장" → "69")
        const numberMatch = content.match(/(\d+)장/);
        if (!numberMatch) {
          return null;
        }
        const number = parseInt(numberMatch[1], 10).toString(); // 앞의 0 제거

        // 2. 제목 추출
        let title = content
          .replace(/\d+장\s*/, '') // 번호 부분 제거
          .replace(/\(통\d+\)/g, '') // (통{숫자}) 패턴 제거
          .replace(/\/$/, '') // 끝의 / 제거
          .trim();

        // 3. S3에서 실제 파일 목록 가져오기
        const files = await loadAccompanimentFiles();
        if (files.length === 0) {
          console.warn('찬양반주 폴더에 파일이 없습니다.');
          // 파일 목록을 가져올 수 없으면 기본 파일명 생성 시도
          const fileName = `${number}장-${title}.mp3`;
          return `찬양반주/${fileName}`;
        }

        // 4. 번호로 시작하는 파일들 필터링
        const numberPattern = new RegExp(`^${number}장-`);
        const candidateFiles = files.filter(file => numberPattern.test(file));

        if (candidateFiles.length === 0) {
          console.warn(`번호 ${number}장으로 시작하는 파일을 찾을 수 없습니다.`);
          // 기본 파일명 생성 시도
          const fileName = `${number}장-${title}.mp3`;
          return `찬양반주/${fileName}`;
        }

        // 5. 제목과 가장 유사한 파일 찾기
        let bestMatch = null;
        let bestScore = 0;

        for (const file of candidateFiles) {
          // 파일명에서 번호와 확장자 제거하여 제목 추출
          const fileTitle = file
            .replace(numberPattern, '')
            .replace(/\.mp3$/, '')
            .trim();

          // 유사도 계산 (공백 무시하고 비교)
          const score = calculateSimilarity(title, fileTitle);
          
          console.log(`파일 매칭 시도: "${file}" vs "${title}" → 유사도: ${score.toFixed(1)}%`);
          
          if (score > bestScore) {
            bestScore = score;
            bestMatch = file;
          }
        }

        if (bestMatch && bestScore >= 50) {
          const filePath = `찬양반주/${bestMatch}`;
          console.log(`파일 매칭 성공: "${filePath}" (유사도: ${bestScore.toFixed(1)}%)`);
          return filePath;
        } else {
          console.warn(`적절한 파일을 찾을 수 없습니다. 최고 유사도: ${bestScore.toFixed(1)}%`);
          // 그래도 가장 유사한 파일 반환 (유사도가 낮아도)
          if (bestMatch) {
            const filePath = `찬양반주/${bestMatch}`;
            console.log(`낮은 유사도이지만 파일 사용: "${filePath}"`);
            return filePath;
          }
          // 기본 파일명 생성 시도
          const fileName = `${number}장-${title}.mp3`;
          return `찬양반주/${fileName}`;
        }
      }

      /**
       * content를 정규화하여 폴더명 비교용으로 변환
       * @param {string} content - 찬송 content (예: "279장 인애하신구세주여(통...)/")
       * @returns {string} - 정규화된 폴더명
       */
      function normalizeContentForFolder(content) {
        if (!content || typeof content !== 'string') {
          return '';
        }
        // 끝의 / 제거, 공백 정규화
        return content.replace(/\/$/, '').trim();
      }

      /**
       * 두 content가 같은 찬송 폴더인지 확인
       * @param {string} content1 - 첫 번째 content
       * @param {string} content2 - 두 번째 content
       * @returns {boolean} - 같은 폴더면 true
       */
      function isSameAccompanimentFolder(content1, content2) {
        const normalized1 = normalizeContentForFolder(content1);
        const normalized2 = normalizeContentForFolder(content2);
        return normalized1 === normalized2 && normalized1 !== '';
      }

      /**
       * 반주 음악 재생
       * @param {string} filePath - MP3 파일 경로
       * @param {string} content - 찬송 content (같은 폴더 확인용)
       */
      async function playAccompaniment(filePath, content) {
        // 기존 재생 중인 음악 정지 (다른 폴더인 경우)
        stopAccompaniment();

        try {
          // API를 통해 파일 존재 여부 확인 및 URL 가져오기
          // s3-image API는 이미지뿐만 아니라 오디오 파일도 지원
          const audioUrl = `${API_BASE}/s3-image?path=${encodeURIComponent(filePath)}`;
          
          console.log('반주 파일 로드 시도:', filePath);
          
          const response = await fetch(audioUrl);
          
          if (!response.ok) {
            console.warn(`반주 파일을 찾을 수 없습니다: ${filePath} (${response.status})`);
            // 파일이 없으면 조용히 실패 (에러 로그만 출력)
            return;
          }

          const audioData = await response.json();
          
          // Audio 객체 생성
          const audio = new Audio();
          
          // API를 통해 가져온 data URL 사용
          if (audioData && audioData.dataUrl) {
            audio.src = audioData.dataUrl;
            console.log('반주 파일 로드 성공 (data URL):', filePath);
          } else {
            // dataUrl이 없으면 직접 S3 URL 사용
            const s3BaseUrl = 'https://hishalom-data.s3.ap-northeast-2.amazonaws.com';
            const pathSegments = filePath.split('/').map(segment => encodeURIComponent(segment));
            audio.src = `${s3BaseUrl}/${pathSegments.join('/')}`;
            console.log('반주 파일 로드 시도 (직접 URL):', filePath);
          }
          
          audio.volume = 0.5; // 기본 볼륨 50%
          audio.loop = false; // 반복 재생 안 함

          // 에러 처리
          audio.addEventListener('error', (e) => {
            console.error('반주 재생 실패:', e);
            console.error('파일 경로:', filePath);
            console.error('오디오 소스 URL:', audio.src);
            console.error('오디오 에러 코드:', audio.error?.code);
            console.error('오디오 에러 메시지:', audio.error?.message);
          });

          // 로드 완료 이벤트
          audio.addEventListener('canplaythrough', () => {
            console.log('반주 파일 로드 완료:', filePath);
          });

          // 로드 시작 이벤트
          audio.addEventListener('loadstart', () => {
            console.log('반주 파일 로드 시작:', filePath);
          });

          // 전역 변수에 저장
          currentAccompanimentAudio = audio;
          currentAccompanimentContent = content; // 현재 재생 중인 content 저장

          // 100ms 후 재생
          setTimeout(() => {
            audio.play().catch(err => {
              console.error('반주 재생 실패:', err);
              console.error('파일 경로:', filePath);
              console.error('오디오 소스 URL:', audio.src);
              console.error('에러 상세:', {
                name: err.name,
                message: err.message,
                stack: err.stack
              });
            });
          }, 100);
        } catch (error) {
          console.error('반주 파일 로드 중 오류:', error);
          console.error('파일 경로:', filePath);
        }
      }

      /**
       * 반주 음악 정지
       */
      function stopAccompaniment() {
        if (currentAccompanimentAudio) {
          currentAccompanimentAudio.pause();
          currentAccompanimentAudio.currentTime = 0;
          currentAccompanimentAudio = null;
          currentAccompanimentContent = null; // content도 초기화
        }
      }

      // 슬라이드 표시
      async function showSlide(index) {
        if (index < 0 || index >= slides.length) return;

        const container = document.querySelector(".presentation-container");
        const currentSlideElement = container.querySelector(".slide.active");
        const newSlide = slides[index];

        // 유형이 바뀌는지 확인 (같은 유형 내에서는 페이드 전환, 다른 유형에서는 즉시 전환)
        const isTypeChange =
          currentSlideElement &&
          currentSlideElement.dataset.stepType !== newSlide.step.Type;

        // 기존 모든 슬라이드 제거 (겹침 방지)
        const existingSlides = container.querySelectorAll(".slide");
        existingSlides.forEach((slide) => {
          if (slide !== currentSlideElement) {
            slide.remove();
          }
        });

        // 새 슬라이드 생성
        const slideElement = document.createElement("div");
        slideElement.className = "slide";
        slideElement.dataset.stepType = newSlide.step.Type; // 유형 정보 저장

        // 성경인 경우
        if (newSlide.step.Type === "성경") {
          const bibleContent = document.createElement("div");
          bibleContent.className = "bible-content";

          const c = newSlide.step.Content;
          const hasValidContent = c && typeof c === "object" && c.book && (c.chapter != null);

          const title = document.createElement("div");
          title.className = "bible-title";
          title.textContent = hasValidContent
            ? `${c.book} ${c.chapter}장`
            : "성경";
          bibleContent.appendChild(title);

          // 성경 구절 컨테이너 생성
          const versesContainer = document.createElement("div");
          versesContainer.className = "bible-verses-container";

          if (!hasValidContent) {
            const errorElement = document.createElement("div");
            errorElement.className = "error";
            errorElement.textContent = "성경 정보가 없거나 올바르지 않습니다. 관리자에서 책·장·절을 선택해 주세요.";
            versesContainer.appendChild(errorElement);
            bibleContent.appendChild(versesContainer);
            slideElement.appendChild(bibleContent);
          } else {
          // 성경 구절 가져오기
          const verses = await getBibleVerses(newSlide.step.Content);
          if (verses && verses.length > 0) {
            // strongVerse 배열 확인
            const strongVerses = newSlide.step.Content.strongVerse || [];

            verses.forEach((verse) => {
              const verseElement = document.createElement("div");
              verseElement.className = "bible-verse";

              // 구절 번호 요소 생성
              const verseNumberElement = document.createElement("span");
              verseNumberElement.className = "verse-number";
              verseNumberElement.textContent = `${verse.verse}절`;
              verseElement.appendChild(verseNumberElement);

              // 구절 내용을 줄 단위로 처리
              const contentLines = verse.content.split("\n");
              contentLines.forEach((line, lineIndex) => {
                const lineElement = document.createElement("div");
                lineElement.className = "bible-text-line";

                // strongVerse 배열에 현재 구절 번호가 포함되어 있는지 확인
                if (strongVerses.includes(verse.verse)) {
                  lineElement.classList.add("strong");
                }

                lineElement.textContent = line;
                verseElement.appendChild(lineElement);
              });

              versesContainer.appendChild(verseElement);
            });
            bibleContent.appendChild(versesContainer);
          } else {
            const errorElement = document.createElement("div");
            errorElement.className = "error";
            errorElement.textContent = "성경 구절을 불러올 수 없습니다.";
            versesContainer.appendChild(errorElement);
            bibleContent.appendChild(versesContainer);
          }

          slideElement.appendChild(bibleContent);

          // 폰트 자동 조정
          setTimeout(() => {
            autoFitBibleVerses(
              bibleContent.querySelector(".bible-verses-container")
            );
          }, 0);
          }
        } else if (newSlide.step.Type === "찬양") {
          const imageElement = document.createElement("div");
          imageElement.className = "slide-image-16by9";
          const img = document.createElement("img");

          // API에서 이미지 데이터 가져오기
          try {
            const response = await fetch(newSlide.imagePath);
            if (response.ok) {
              const imageData = await response.json();
              img.src = imageData.dataUrl;
            } else {
              console.error(
                `이미지 로딩 실패: ${newSlide.imagePath} - ${response.status}`
              );
              throw new Error(
                `이미지를 불러올 수 없습니다. (${response.status})`
              );
            }
          } catch (error) {
            console.error(`이미지 로딩 오류: ${newSlide.imagePath}`, error);
            // 교독, 찬송, 찬양 유형의 경우 이미지가 없어도 다음 단계로 진행
            if (
              newSlide.step.Type === "교독" ||
              newSlide.step.Type === "찬송" ||
              newSlide.step.Type === "찬양"
            ) {
              console.log(
                `Step ${newSlide.step.Step}: ${newSlide.step.Type} - 이미지가 없어서 건너뜀`
              );
              // 빈 슬라이드 생성하여 다음 단계로 진행
              slideElement.innerHTML = `<div class="error">${newSlide.step.Type} 이미지를 찾을 수 없습니다: ${newSlide.step.Content}</div>`;
            } else {
              slideElement.innerHTML = `<div class="error">이미지를 불러올 수 없습니다: ${newSlide.imagePath}</div>`;
            }
            container.appendChild(slideElement);
            return;
          }

          img.alt = `${newSlide.step.Type} - ${newSlide.step.Content}`;
          img.className = "slide-image-cover";

          imageElement.appendChild(img);
          slideElement.appendChild(imageElement);
        } else {
          // 이미지인 경우
          const img = document.createElement("img");

          // API에서 이미지 데이터 가져오기
          try {
            const response = await fetch(newSlide.imagePath);
            if (response.ok) {
              const imageData = await response.json();
              img.src = imageData.dataUrl;
            } else {
              throw new Error("이미지를 불러올 수 없습니다.");
            }
          } catch (error) {
            slideElement.innerHTML = `<div class="error">이미지를 불러올 수 없습니다: ${newSlide.imagePath}</div>`;
            container.appendChild(slideElement);
            return;
          }

          img.alt = `${newSlide.step.Type} - ${newSlide.step.Content}`;

          slideElement.appendChild(img);
        }

        container.appendChild(slideElement);

        // 반주 처리
        if (newSlide.step.Type === "찬송" && newSlide.step.Accompaniment) {
          const content = typeof newSlide.step.Content === 'string' 
            ? newSlide.step.Content 
            : '';
          
          // 같은 폴더의 반주가 이미 재생 중인지 확인
          if (isSameAccompanimentFolder(currentAccompanimentContent, content)) {
            console.log('같은 폴더의 반주가 이미 재생 중입니다. 계속 재생합니다.');
            // 반주는 계속 재생되므로 아무것도 하지 않음
          } else {
            // 다른 폴더이거나 반주가 재생 중이 아니면 새로운 반주 재생
            // getAccompanimentFilePath는 async 함수이므로 await 필요
            getAccompanimentFilePath(content).then(accompanimentPath => {
              if (accompanimentPath) {
                console.log('반주 재생 시작:', accompanimentPath);
                playAccompaniment(accompanimentPath, content);
              } else {
                console.warn('반주 파일 경로를 생성할 수 없습니다:', content);
                stopAccompaniment();
              }
            }).catch(error => {
              console.error('반주 파일 경로 생성 오류:', error);
              stopAccompaniment();
            });
          }
        } else {
          // 찬송이 아니거나 반주가 비활성화된 경우 정지
          stopAccompaniment();
        }

        if (isTypeChange) {
          // 유형이 바뀌는 경우: 부드러운 페이드 전환 (화면 초기화)
          if (currentSlideElement) {
            currentSlideElement.classList.add("fade-out");
          }

          // 새 슬라이드 페이드 인
          setTimeout(() => {
            slideElement.classList.add("active");
          }, 50);

          // 이전 슬라이드 제거
          setTimeout(() => {
            if (currentSlideElement) {
              currentSlideElement.remove();
            }
          }, 270);
        } else {
          // 같은 유형 내에서의 전환: 즉시 전환
          if (currentSlideElement) {
            currentSlideElement.remove(); // 이전 슬라이드 즉시 제거
          }
          slideElement.classList.add("active"); // 새 슬라이드 즉시 표시
        }

        currentSlideIndex = index;

        // 슬라이드 정보 업데이트
        updateSlideInfo(newSlide);
        updateSlideCounter();

        // 전환 완료 후 정리
        setTimeout(() => {
          cleanupSlides();
        }, 300);
      }

      // 슬라이드 정보 업데이트
      function updateSlideInfo(slide) {
        const infoElement = document.querySelector(".slide-info");
        infoElement.textContent = `Step ${slide.step.Step}: ${slide.step.Type} - ${slide.step.Content}`;
      }

      // 슬라이드 카운터 업데이트
      function updateSlideCounter() {
        const counterElement = document.querySelector(".slide-counter");
        counterElement.textContent = `${currentSlideIndex + 1} / ${
          slides.length
        }`;
      }

      // 다음 슬라이드
      async function nextSlide() {
        if (currentSlideIndex < slides.length - 1) {
          await showSlide(currentSlideIndex + 1);
        }
      }

      // 이전 슬라이드
      async function previousSlide() {
        if (currentSlideIndex > 0) {
          await showSlide(currentSlideIndex - 1);
        }
      }

      // 이전 파일 (이전 step의 첫 번째 슬라이드로 이동)
      async function previousFile() {
        if (slides.length === 0 || currentSlideIndex === 0) return;
        
        const currentSlide = slides[currentSlideIndex];
        const currentStepIndex = currentSlide.stepIndex;
        
        // 현재 step의 첫 번째 슬라이드 인덱스 찾기
        let currentStepFirstIndex = -1;
        for (let i = 0; i <= currentSlideIndex; i++) {
          if (slides[i].stepIndex === currentStepIndex) {
            currentStepFirstIndex = i;
            break;
          }
        }
        
        // 이전 step의 첫 번째 슬라이드 찾기
        if (currentStepFirstIndex > 0) {
          const previousStepIndex = slides[currentStepFirstIndex - 1].stepIndex;
          // 이전 stepIndex를 가진 첫 번째 슬라이드 찾기
          let previousStepFirstIndex = -1;
          for (let i = 0; i < currentStepFirstIndex; i++) {
            if (slides[i].stepIndex === previousStepIndex) {
              previousStepFirstIndex = i;
              break;
            }
          }
          
          if (previousStepFirstIndex !== -1) {
            await showSlide(previousStepFirstIndex);
          }
        }
      }

      // 다음 파일 (다음 step의 첫 번째 슬라이드로 이동)
      async function nextFile() {
        if (slides.length === 0) return;
        
        const currentSlide = slides[currentSlideIndex];
        const currentStepIndex = currentSlide.stepIndex;
        
        // 다음 step의 첫 번째 슬라이드 찾기
        // 현재 stepIndex보다 큰 stepIndex를 가진 첫 번째 슬라이드 찾기
        let nextStepFirstIndex = -1;
        for (let i = currentSlideIndex + 1; i < slides.length; i++) {
          if (slides[i].stepIndex > currentStepIndex) {
            // 이전 슬라이드가 같은 stepIndex가 아니면 첫 번째 슬라이드
            if (i === 0 || slides[i - 1].stepIndex !== slides[i].stepIndex) {
              nextStepFirstIndex = i;
              break;
            }
          }
        }
        
        if (nextStepFirstIndex !== -1) {
          await showSlide(nextStepFirstIndex);
        } else {
          // 다음 step이 없으면 마지막 슬라이드로 이동
          if (currentSlideIndex < slides.length - 1) {
            await showSlide(slides.length - 1);
          }
        }
      }

      // 자동재생 토글
      function toggleAutoPlay() {
        if (isAutoPlaying) {
          stopAutoPlay();
        } else {
          startAutoPlay();
        }
      }

      // 자동재생 시작
      function startAutoPlay() {
        isAutoPlaying = true;
        document.getElementById("autoPlayBtn").textContent = "정지";
        autoPlayInterval = setInterval(() => {
          if (currentSlideIndex < slides.length - 1) {
            nextSlide();
          } else {
            stopAutoPlay();
          }
        }, 1000); // 1초마다 (3배 빠르게)
      }

      // 자동재생 정지
      function stopAutoPlay() {
        isAutoPlaying = false;
        document.getElementById("autoPlayBtn").textContent = "자동재생";
        if (autoPlayInterval) {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
        }
      }

      // 전체화면 토글
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }

      // 전체화면 상태 감지
      function handleFullscreenChange() {
        const container = document.querySelector(".presentation-container");
        if (document.fullscreenElement) {
          container.classList.add("fullscreen");
        } else {
          container.classList.remove("fullscreen");
        }
      }

      // 전체화면 이벤트 리스너
      document.addEventListener("fullscreenchange", handleFullscreenChange);
      document.addEventListener(
        "webkitfullscreenchange",
        handleFullscreenChange
      );
      document.addEventListener("mozfullscreenchange", handleFullscreenChange);
      document.addEventListener("MSFullscreenChange", handleFullscreenChange);

      // 에러 표시
      function showError(message) {
        const loadingElement = document.querySelector(".loading");
        loadingElement.style.display = "none";

        const errorElement = document.createElement("div");
        errorElement.className = "error";
        errorElement.textContent = message;
        document
          .querySelector(".presentation-container")
          .appendChild(errorElement);
      }

      // 키보드 이벤트
      document.addEventListener("keydown", function (event) {
        switch (event.key) {
          case "ArrowRight":
          case " ":
            event.preventDefault();
            nextSlide();
            break;
          case "ArrowLeft":
            event.preventDefault();
            previousSlide();
            break;
          case "PageUp":
            event.preventDefault();
            nextSlide();
            break;
          case "PageDown":
            event.preventDefault();
            previousSlide();
            break;
          case "Escape":
            if (document.fullscreenElement) {
              document.exitFullscreen();
            }
            break;
          case "f":
          case "F":
            event.preventDefault();
            toggleFullscreen();
            break;
          case "a":
          case "A":
            event.preventDefault();
            toggleAutoPlay();
            break;
        }
      });

      // 자동 폰트 크기/줄 간격 조정 함수
      function autoFitBibleVerses(container) {
        if (!container) return;
        const maxHeight =
          container.clientHeight || container.parentElement.clientHeight;
        let fontSize = 2.8; // em, 시작값
        let lineHeight = 1.6;
        const minFontSize = 1.2; // em, 최소값
        const minLineHeight = 1.15;
        const verses = container.querySelectorAll(".bible-verse");
        while (container.scrollHeight > maxHeight && fontSize > minFontSize) {
          fontSize -= 0.08;
          lineHeight -= 0.03;
          verses.forEach((v) => {
            v.style.fontSize = fontSize + "em";
            v.style.lineHeight = lineHeight;
          });
        }
      }

      // 교회별 worship.json 로드 함수 추가
      async function loadWorshipData(folder) {
        try {
          let url = `${API_BASE}/worship`;
          if (folder) url += `?folder=${encodeURIComponent(folder)}`;
          const response = await fetch(url);
          if (!response.ok)
            throw new Error("worship.json 파일을 찾을 수 없습니다.");
          worshipData = await response.json();
          await processWorshipData();
        } catch (error) {
          showError("예배 데이터를 불러오는데 실패했습니다: " + error.message);
        }
      }

      // 페이지 로드 시 데이터 로드
      window.addEventListener("load", loadWorshipFolders);
    </script>
  </body>
</html>
